# Demo dataset (ADR-0004): 9 FalkorDB repos, last 12 months.
org = "FalkorDB"
since_months = 12
component_depth = 2  # directory levels that form a Component (SPEC OQ-4)

# Logins treated as bots in addition to GitHub's own Bot accounts.
bot_logins = ["dependabot", "renovate", "github-actions", "codecov", "coderabbitai"]

[[repos]]
name = "FalkorDB"
# graph/src holds a whole subsystem; split it one level deeper
component_depth_overrides = { "graph/src" = 3 }

[[repos]]
name = "GraphRAG-SDK"
# code lives at graphrag_sdk/src/graphrag_sdk/<area> (ingestion, retrieval, ...)
component_depth_overrides = { "graphrag_sdk/src/graphrag_sdk" = 4, "graphrag_sdk/tests" = 3 }

[[repos]]
name = "QueryWeaver"

[[repos]]
name = "code-graph"

[[repos]]
name = "falkordb-browser"

[[repos]]
name = "falkordb-py"
component_depth = 1  # flat package: falkordb/, tests/, docs/

[[repos]]
name = "falkordb-ts"

[[repos]]
name = "FalkorDB-MCPServer"

[[repos]]
name = "docs"
component_depth = 1
